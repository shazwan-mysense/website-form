# Cloudflare Pages project: static page in public/, API in functions/, answers + files in R2.
name = "client-brief"
pages_build_output_dir = "public"
compatibility_date = "2026-11-01"

[[r2_buckets]]
binding = "FILES"
bucket_name = "client-briefs"

# Secrets (set in the dashboard or with `wrangler pages secret put`, never committed):
#   BRIEF_SECRET  long random string, signs upload links and the admin cookie
#   ADMIN_PASS    the password for /admin/
